#-----------------------------------------------------------------------
# OpenPOPCON input file: radiative ARC
#
# An ARC-class, high-field D-T reactor run in a radiative L-mode, with
# krypton seeded to Zeff = 2.1 and the H89 L-mode scaling.
#
# Parabolic profiles rather than a gEQDSK, deliberately: it keeps R, a,
# kappa, delta and I_P available to POPCON_scan, which the gEQDSK path
# overrides.
#-----------------------------------------------------------------------

name: "ARC Rad-Lmode"

#----------------------
# Machine parameters
#----------------------

R: 4.2            # major radius, m (R_0 is accepted as an alias)
a: 1.2            # minor radius, m
kappa: 1.6        # elongation
delta: 0.3        # triangularity

I_P: 14.          # plasma current, MA  (or give qstar instead)
B_0: 11.5         # on-axis toroidal field, T  (or B_coil and wall_thickness)

tipeak_over_tepeak: 1.1

#----------------------
# Plasma composition
#----------------------

fuel: 2           # 1 D-D, 2 D-T, 3 D-He3

# He, Ne, Ar, Kr, Xe, W
impurityfractions: [0.02, 0., 0., 0.001, 0., 0.]

# krypton is the Zeff carrier; the fraction above is overwritten from this
Zeff_target: 2.1
impurity: 3       # 0 He, 1 Ne, 2 Ar, 3 Kr, 4 Xe, 5 W

#----------------------
# Confinement
#----------------------

# an L-mode scaling, since the radiative scenario gives up the pedestal
scalinglaw: "H89"
H_fac: 1.3

nr: 100           # number of radial points

#----------------------
# Profiles
#----------------------

gfilename: ""
profsfilename: ""

# f(rho) = (1 - offset) * (1 - rho^alpha1)^alpha2 + offset
j_alpha1: 2.
j_alpha2: 3.
j_offset: 0.

ne_alpha1: 2.
ne_alpha2: 1.1
ne_offset: 0.25

ni_alpha1: 2.
ni_alpha2: 1.1
ni_offset: 0.25

Ti_alpha1: 2.
Ti_alpha2: 1.5
Ti_offset: 0.005

Te_alpha1: 2.
Te_alpha2: 1.5
Te_offset: 0.005

#----------------------
# Algorithm settings
#----------------------

Nn: 20            # number of density points
NTi: 20           # number of temperature points

# n_G = Ip / (pi a^2) = 3.09e20 m^-3
nmax_frac: 1.2
nmin_frac: 0.3

Tmax_keV: 15.
Tmin_keV: 3

resistivity_model: "Jardin"   # Jardin, Paz-Soldan, or maximum

verbosity: 1
parallel: False

#----------------------
# Scan (used by POPCON_scan; ignored by a plain POPCON)
#----------------------

# how much seeding the machine tolerates, against how good the L-mode
# confinement has to be
scan:
  rows:
    parameter: Zeff_target
    values: [1.8, 2.1, 2.4]
  cols:
    parameter: H_fac
    values: [1.1, 1.3, 1.5]
